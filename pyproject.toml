[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessmgr"
version = "0.1.1"
description = "Chargement et distribution securises de credentials (mail, Telegram, KuCoin, DataBento, healthcheck) depuis un fichier JSON externe, sans jamais exposer de secret en clair dans le code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evariste Galois" }]
keywords = ["credentials", "secrets", "access", "configuration", "vault", "healthcheck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/EvaristeGaloisParis/AccessManager"
Repository = "https://github.com/EvaristeGaloisParis/AccessManager"
Issues = "https://github.com/EvaristeGaloisParis/AccessManager/issues"

[tool.setuptools]
# le nom de distribution est "accessmgr" mais le package importable reste "AccessMgr"
packages = ["AccessMgr"]
